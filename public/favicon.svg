<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFF0DE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lotusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB833;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8641D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="omGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8641D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD34D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8A020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD34D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded rect background with gold border -->
  <rect x="3" y="3" width="194" height="194" rx="36" ry="36" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="4"/>

  <!-- Om symbol -->
  <text x="100" y="55" text-anchor="middle" font-family="serif" font-size="32" font-weight="bold" fill="url(#omGrad)">ॐ</text>

  <!-- Lotus flower petals (center) -->
  <!-- Center petal -->
  <ellipse cx="100" cy="105" rx="14" ry="28" fill="url(#lotusGrad)" opacity="0.95"/>

  <!-- Inner left petal -->
  <ellipse cx="82" cy="112" rx="13" ry="24" fill="url(#lotusGrad)" opacity="0.9" transform="rotate(-20 82 112)"/>

  <!-- Inner right petal -->
  <ellipse cx="118" cy="112" rx="13" ry="24" fill="url(#lotusGrad)" opacity="0.9" transform="rotate(20 118 112)"/>

  <!-- Mid left petal -->
  <ellipse cx="64" cy="118" rx="11" ry="22" fill="url(#lotusGrad)" opacity="0.75" transform="rotate(-38 64 118)"/>

  <!-- Mid right petal -->
  <ellipse cx="136" cy="118" rx="11" ry="22" fill="url(#lotusGrad)" opacity="0.75" transform="rotate(38 136 118)"/>

  <!-- Outer left petal -->
  <ellipse cx="48" cy="125" rx="9" ry="18" fill="url(#lotusGrad)" opacity="0.55" transform="rotate(-55 48 125)"/>

  <!-- Outer right petal -->
  <ellipse cx="152" cy="125" rx="9" ry="18" fill="url(#lotusGrad)" opacity="0.55" transform="rotate(55 152 125)"/>

  <!-- White overlay separation lines on petals -->
  <line x1="100" y1="85" x2="100" y2="130" stroke="white" stroke-width="1.2" opacity="0.6"/>
  <line x1="91" y1="90" x2="82" y2="130" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="109" y1="90" x2="118" y2="130" stroke="white" stroke-width="1" opacity="0.4"/>

  <!-- Base of lotus -->
  <ellipse cx="100" cy="130" rx="30" ry="6" fill="#E8641D" opacity="0.5"/>

  <!-- Thin gold divider line -->
  <line x1="55" y1="140" x2="145" y2="140" stroke="#C8972A" stroke-width="1" opacity="0.7"/>

  <!-- MitsSadhana text -->
  <text x="100" y="163" text-anchor="middle" font-family="serif" font-size="22" font-weight="bold">
    <tspan fill="#2A5C2A">Mits</tspan><tspan fill="#E8641D">Sadhana</tspan>
  </text>

  <!-- Small lotus divider at bottom -->
  <text x="100" y="182" text-anchor="middle" font-family="serif" font-size="10" fill="#C8972A">✿</text>
</svg>